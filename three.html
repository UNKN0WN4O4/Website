<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Void - Avatar</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .ui-overlay h2 {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .back-btn {
            pointer-events: auto;
            text-decoration: none;
            color: var(--accent, #00d4ff);
            border: 1px solid var(--accent, #00d4ff);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .back-btn:hover {
            background: var(--accent, #00d4ff);
            color: #000;
            box-shadow: 0 0 15px var(--accent, #00d4ff);
        }
    </style>
</head>

<body>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <h2>YOU ARE HERE</h2>
        <a href="index.html" class="back-btn">Return to Surface</a>
    </div>

    <!-- Global Scripts (No Import Map needed for file:// usage) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>

    <!-- Main Script -->
    <script src="avatar.js"></script>
</body>

</html>
