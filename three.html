<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Void - Avatar</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .ui-overlay h2 {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .back-btn {
            pointer-events: auto;
            text-decoration: none;
            color: var(--accent, #00d4ff);
            border: 1px solid var(--accent, #00d4ff);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .back-btn:hover {
            background: var(--accent, #00d4ff);
            color: #000;
            box-shadow: 0 0 15px var(--accent, #00d4ff);
        }
    </style>
</head>

<body>

    <div id="canvas-container"></div>
    <div id="bubble-container"></div>

    <div class="ui-overlay">
        <a href="index.html" class="back-btn">Return to Surface</a>
    </div>

    <!-- Chat Input -->
    <div class="chat-input-container">
        <input type="text" id="chatInput" placeholder="Say something..." autocomplete="off">
    </div>

    <style>
        /* New Chat Styles */
        #bubble-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .speech-bubble {
            position: absolute;
            background: white;
            color: black;
            padding: 10px 15px;
            border-radius: 20px;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            font-size: 0.9rem;
            max-width: 200px;
            transform: translate(-50%, -100%);
            /* Center above point */
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s, margin-top 0.3s;
            z-index: 100;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }

        .chat-input-container {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 300px;
        }

        #chatInput {
            width: 100%;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            color: white;
            outline: none;
            font-size: 1rem;
            text-align: center;
            transition: all 0.3s;
        }

        #chatInput:focus {
            background: rgba(0, 0, 0, 0.8);
            border-color: var(--accent, #00d4ff);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }
    </style>

    <!-- Global Scripts (No Import Map needed for file:// usage) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>

    <!-- Main Script -->
    <script src="avatar.js"></script>
</body>

</html>
